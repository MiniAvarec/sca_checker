[package]
name = "sca_checker_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
reqwest = { version = "0.13.0", features = ["blocking", "json", "rustls-tls"] }
toml = "0.8.12"
roxmltree = "0.19.0"
regex = "1.10.4"
walkdir = "2.5.0"
urlencoding = "2.1.3"
once_cell = "1.19.0"
chrono = { version = "0.4.38", default-features = false, features = ["std", "clock"] }
